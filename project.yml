# 予備: KadaiNotify.xcodeproj が Xcode で開けなかったときに、XcodeGen で作り直すための設定。
#   brew install xcodegen && xcodegen generate
# (普段は使わない。KadaiNotify.xcodeproj をそのまま開けばよい)
name: KadaiNotify
options:
  bundleIdPrefix: io.github.kotakota914
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  KadaiCore:
    path: Packages/KadaiCore
targets:
  KadaiNotify:
    type: application
    platform: iOS
    sources:
      - KadaiNotify
      - Shared
    dependencies:
      - package: KadaiCore
      - target: KadaiNotifyWidgetExtension
    entitlements:
      path: Config/KadaiNotify.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kotakota914.KadaiNotify
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 課題通知
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
  KadaiNotifyWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - KadaiNotifyWidget
      - Shared
    dependencies:
      - package: KadaiCore
    entitlements:
      path: Config/KadaiNotifyWidget.entitlements
    info:
      path: Config/KadaiNotifyWidget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kotakota914.KadaiNotify.Widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 課題通知ウィジェット
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
